<text x="450" y="488" font-size="12" fill="#444" text-anchor="middle">Pin 9 HIGH → transistor conducts → motor spins. The diode absorbs the motor's voltage spike when it stops.</text>
<text x="450" y="507" font-size="11" fill="#666" text-anchor="middle">If the Uno resets when the motor starts: power the motor from the kit's power-supply module (common GND).</text>
