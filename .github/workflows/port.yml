# Hold the browser port and the Python source of truth together.
#
# reference.json is a recording of what the Python pipeline produced. Checking
# only the JavaScript against it proves the port matches that recording, not
# that it matches bioscout today -- so a change on the Python side would sail
# through while the two implementations quietly diverged. Both sides are
# therefore checked against the same fixture:
#
#   check_reference.py   Python == reference.json
#   test_port.mjs        JS     == reference.json
#
# Every case carries its own input landmarks, so neither step needs a video or
# any data outside this repository.
name: port

on:
  push:
  pull_request:
  # bioscout can change without anything happening here, and that is exactly
  # the drift this job exists to catch, so it also runs on a schedule.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --no-deps on purpose. bioscout's install_requires pulls the desktop GUI
      # stack (customtkinter, pyautogui, pygetwindow, screeninfo) and the full
      # scientific stack, none of which this check touches: every module on the
      # import path from bioscout.movement_detector.markerless needs numpy and
      # nothing else. Installing the lot would add minutes and a display server
      # to a job that is meant to be cheap enough to run on every push.
      - name: Install the Python side
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          # TEMPORARY: pinned to the markerless branch until it lands on
          # bioscout main. Switch back to @main when it merges -- leaving it
          # on a branch means this check silently stops watching the code
          # that actually ships.
          pip install --no-deps "bioscout @ git+https://github.com/basgoncalves/bioscout.git@markerless"

      - name: Python agrees with reference.json
        run: python tools/check_reference.py

      - name: JavaScript agrees with reference.json
        run: node test_port.mjs
